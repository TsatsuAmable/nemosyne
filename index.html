<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemosyne Spatial Data Analysis Suite</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: 'Courier New', Courier, monospace;
      }
      #overlay {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #00ffcc;
        text-shadow: 0 0 6px #00ffcc;
        z-index: 100;
        pointer-events: none;
        user-select: none;
      }
      #overlay h1 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
        letter-spacing: 0.1em;
      }
      #overlay p {
        margin: 0;
        font-size: 0.85rem;
        color: #88ccff;
      }
      #overlay .about {
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: #ff77aa;
        max-width: 420px;
        line-height: 1.4;
      }
      #overlay a {
        color: #00ffcc;
        text-decoration: underline;
        pointer-events: auto;
      }
      #telemetry {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: #00ffcc;
        font-size: 0.75rem;
        z-index: 100;
        pointer-events: none;
        user-select: none;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="overlay">
      <h1>NEMOSYNE // SPATIAL DATA SUITE</h1>
    </div>
    <div id="telemetry">initializing…</div>
    <style>
      #analyst-journey-controls {
        position: fixed;
        z-index: 10;
        right: 1rem;
        bottom: 1rem;
        display: grid;
        gap: 0.4rem;
        max-width: 18rem;
        max-height: calc(100vh - 2rem);
        padding: 0.8rem;
        overflow: auto;
        color: #d8fff6;
        background: rgba(5, 15, 25, 0.9);
        border: 1px solid rgba(0, 255, 204, 0.45);
        font: 12px monospace;
      }
      #analyst-journey-controls h2,
      #analyst-journey-controls p {
        margin: 0;
      }
      #analyst-journey-controls label {
        color: rgba(216, 255, 246, 0.8);
      }
      #analyst-journey-controls button,
      #analyst-journey-controls input {
        padding: 0.45rem 0.6rem;
        color: inherit;
        background: rgba(0, 255, 204, 0.12);
        border: 1px solid rgba(0, 255, 204, 0.4);
        box-sizing: border-box;
        font: inherit;
      }
      #analyst-journey-controls input {
        min-width: 0;
        width: 100%;
      }
      #analyst-journey-controls button {
        cursor: pointer;
      }
      #analyst-journey-status[data-state='error'],
      #analyst-representation-outcome[data-state='nil'] {
        color: #ff9eb7;
      }
      #analyst-journey-controls button:focus-visible,
      #analyst-journey-controls input:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
    </style>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
