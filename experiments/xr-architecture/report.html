<!doctype html><meta charset="utf-8"><title>Nemosyne Experiment Harness</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{border:1px solid #bbb;border-radius:12px;padding:16px}pre{overflow:auto;background:#eee;padding:12px;border-radius:8px}.muted{opacity:.7}</style><header><h1>Nemosyne Experiment Harness</h1><button onclick="load()">Refresh</button></header><p class="muted">Portable status and evidence report. Simulator results never imply Quest/device or human qualification.</p><div id="app">Loading…</div><script>async function load(){try{const r=await fetch('/report.json?'+Date.now()).then(x=>x.json());document.querySelector('#app').innerHTML='<div class="cards">'+Object.entries(r.summary).map(([k,v])=>'<div class="card"><b>'+k+'</b><h2>'+v+'</h2></div>').join('')+'</div><h2>Evidence</h2><pre>'+JSON.stringify(r,null,2)+'</pre>'}catch(e){document.querySelector('#app').textContent='No report yet: '+e}}load()</script>
