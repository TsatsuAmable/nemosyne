[package]
name = "nemosyne-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Nemosyne Contributors"]
description = "Nemosyne runtime core compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/TsatsuAmable/nemosyne"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["console"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
csv = "1.3.1"
# Battle-tested linear-algebra substrate for the Facts correlation matrix and
# (in a follow-up Wave 1 sub-commit) linfa/smartcore clustering & isolation
# forest. Pure Rust, compiles to wasm32-unknown-unknown.
ndarray = "0.15"
# Battle-tested descriptive-statistics crate (rule 4): skewness and excess
# kurtosis come from `statify` rather than hand-rolled standardized moments.
# Pure Rust, no std-required RNG, compiles to wasm32-unknown-unknown.
statify = "0.2"
petgraph = { version = "0.6", default-features = false, features = ["graphmap"] }
statrs = { version = "0.17", default-features = false }
getrandom = { version = "0.4", features = ["js"] }
rustfft = "6.2"
num-complex = "0.4"
# RustCrypto implementation used for content-addressed analytical fingerprints.
sha2 = "0.10"

# Deterministic, stable allocator for long-running sessions.
# wee_alloc is avoided because of known fragmentation issues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# lol_alloc can be enabled after Phase 0 baseline measurements; dlmalloc is the default.

[dev-dependencies]
# Enables wasm-bindgen-test for in-browser kernel parity tests (the middle
# option of the porting rule: Rust #[test] + wasm-bindgen-test + JS RuntimeBridge).
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1
