id: no-module-global-evidence-capture
valid:
  - "const capture = await port.captureGovernedEvidenceReceipt(req)"
  - "const snapshot = await this._atlas.captureGovernedEvidenceReceipt()"
  # Reading the producer from an injected kernel is the required form, so it must
  # stay valid. An identifier-level rule rejected it (and the interface that
  # declares it), which is why the guard is import-level instead.
  - "const produceReceiptBundle = kernel.statisticsEvidenceReceiptBundle"
  - "const readDatasetFingerprint = kernel.datasetFingerprint"
  - "interface StatisticsEvidenceReceiptKernel { statisticsEvidenceReceiptBundle(handle: number): unknown | null }"
  - "import { kernelVersion } from '../wasm/RuntimeBridge.ts'"
  # A re-export of a different binding is not the producer.
  - "export { kernelVersion } from '../wasm/RuntimeBridge.ts'"
  # A star barrel of some *other* module republishes no analytical authority, so
  # the star branch must key on the source, not on the star alone.
  - "export * from '../data/EvidenceReceipt.ts'"
  - "export * as evidence from '../data/EvidenceReceipt.ts'"
  # Another wasm module's star barrel republishes no producer either, so the
  # alternation matching the `wasm/index` barrel must not become a blanket ban on
  # everything under `wasm/`.
  - "export * from '../wasm/TypedColumnsCodec.ts'"
  # The `wasm` segment is anchored, so a star barrel of a sibling directory that
  # merely contains `wasm/` is not this producer's route.
  - "export * from '../xwasm/index.ts'"
  # A sibling whose name merely ends in `wasm` is not this producer's route, and
  # `\b` must not turn another module under `wasm/` into the barrel.
  - "export * from '../data-wasm/index.ts'"
  - "export * from '../wasm/indexHelper.ts'"
invalid:
  - "import { statisticsEvidenceReceiptBundle } from '../wasm/RuntimeBridge.ts'"
  - "import { statisticsEvidenceReceiptBundle as produce } from '../wasm/RuntimeBridge.ts'"
  - "import { kernelVersion, statisticsEvidenceReceiptBundle } from '../wasm/RuntimeBridge.ts'"
  # Barrel re-exports reach the same binding without naming it at the use site.
  - "export { statisticsEvidenceReceiptBundle } from '../wasm/RuntimeBridge.ts'"
  - "export { statisticsEvidenceReceiptBundle as produce } from '../wasm/RuntimeBridge.ts'"
  # Star barrels produce neither an import_specifier nor an export_specifier, so
  # they republished the producer invisibly until this branch was added.
  - "export * from '../wasm/RuntimeBridge.ts'"
  - "export * as bridge from '../wasm/RuntimeBridge.ts'"
  # The production barrel republishes the bridge's surface and today omits the
  # producer. A star re-export of it would republish the producer the moment it
  # is added, so the route is closed now rather than left to the barrel's
  # current contents.
  - "export * from '../wasm/index.ts'"
  - "export * as wasm from '../wasm/index.ts'"
  # The bare-directory spelling resolves to the same barrel under
  # `moduleResolution: "bundler"`, so it republishes the producer the moment the
  # barrel does.
  - "export * from '../wasm'"
  - "export * as wasm from '../wasm'"
  # Separator variants a resolver treats as the same path.
  - "export * from '../wasm/'"
  - "export * as wasm from '../wasm/.'"
  - "export * from '../wasm//index.ts'"
