id: no-runtime-bridge-dynamic-import
language: TypeScript
severity: error
message: >-
  Issue #834: `await import('…/RuntimeBridge.ts')` hands the caller the whole
  runtime namespace, so it reaches any module-global analytical producer
  without ever naming it — routing around both the import-level guard in
  no-module-global-evidence-capture and the namespace-import guard. Analytical
  authority reaches callers through the injected kernel contract and the
  analytical execution port. Exactly one module is allowed to load the runtime
  itself: the injection owner that installs a port over it.
files:
  - src/**/*.ts
ignores:
  - src/wasm/**/*.ts
  # AnalyticalRuntimeOwner is the composition root that *installs* the port; it
  # owns the runtime import/init and is the one legitimate dynamic consumer.
  - src/vr/runtime/AnalyticalRuntimeOwner.ts
rule:
  kind: call_expression
  all:
    # ast-grep's `has` stops at immediate children by default, so the source
    # string (a grandchild, under `arguments`) needs `stopBy: end`.
    - has:
        kind: import
    - has:
        kind: string
        regex: RuntimeBridge
        stopBy: end
