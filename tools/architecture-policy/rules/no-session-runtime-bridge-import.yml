id: no-session-runtime-bridge-import
language: TypeScript
severity: error
message: >-
  Issue #834: the session layer reaches analytical authority only through
  AtlasCore and the analytical execution port that is installed on it. Importing
  the module-global runtime bridge here re-creates a capture path that survives
  replacing, disposing or de-capability-ing the injected port.
files:
  - src/session/**/*.ts
rule:
  any:
    # `import … from '…/wasm/RuntimeBridge…'`.
    #
    # The alternation also matches the production barrel `src/wasm/index.ts`,
    # which republishes `kernelVersion` and `datasetFingerprint` from the bridge.
    # Keying on the literal `RuntimeBridge` alone left that barrel an unguarded
    # alias: a session file could read the same module-global identity authority
    # through it and the scan stayed clean (reproduced by adversarial review with
    # a probe tree). The barrel is a republishing surface for this module, so it is
    # the same route with one hop added.
    #
    # `(^|/)` anchors the `wasm` segment. Without it the alternation also matched
    # any sibling directory merely *containing* `wasm/` (`'../xwasm/index.ts'`),
    # which is an over-block rather than a route.
    #
    # The second alternative covers the bare-directory spelling `'../../wasm'`,
    # which `moduleResolution: "bundler"` resolves to the same barrel `index.ts`.
    # `\b` cannot express it: `wasm/` requires a following path segment, so the
    # directory form needs its own end-anchored branch. Writing it as
    # `wasm/(RuntimeBridge|index)?\b` instead would over-match every other module
    # under `wasm/` (`'../wasm/TypedColumnsCodec.ts'`), breaking a valid form.
    - kind: import_statement
      has:
        kind: string
        regex: "(^|/)wasm/(RuntimeBridge|index)\\b|(^|/)wasm['\"`]$"
    # `export … from '…'` hands the same authority to every importer of this
    # module, so it is the import route with one more hop. Named re-exports
    # (`export { datasetFingerprint } from …`) and star re-exports
    # (`export * from …`) both parse as an export_statement carrying the source
    # string, and neither was covered before.
    - kind: export_statement
      has:
        kind: string
        regex: "(^|/)wasm/(RuntimeBridge|index)\\b|(^|/)wasm['\"`]$"
