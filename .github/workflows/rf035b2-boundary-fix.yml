name: rf035b2-boundary-fix
on:
  push:
    branches: [fix/rf035b2-row-view-transfer]
    paths:
      - 'scripts/fix-rf035b2-boundary.py'
      - '.github/workflows/rf035b2-boundary-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/rf035b2-row-view-transfer
          fetch-depth: 0
      - run: python scripts/fix-rf035b2-boundary.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/runtime-bridge-module-boundaries.test.ts
          git add -u -- .github/workflows/rf035b2-boundary-fix.yml scripts/fix-rf035b2-boundary.py
          git commit -m 'test(rf035): admit compact row-view bridge export'
          git push origin HEAD:fix/rf035b2-row-view-transfer
