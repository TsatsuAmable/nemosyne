name: iwsdk-input-preflight

on:
  push:
    branches:
      - refactor/iwsdk-input-provider

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[iwsdk-preflight]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/iwsdk-input-provider
      - name: Repair narrow type regression
        run: sed -i 's/removeHudObject(obj: THREE.Object3D)/removeHudObject(obj: HudObject)/' src/vr/InputRouter.ts
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Focused provider tests
        run: npx vitest run --config vitest.config.ts tests/xr-input-provider.test.ts
      - name: Lint changed input surface
        run: npx eslint src/vr/InputRouter.ts src/vr/input/XRInputProvider.ts src/vr/input/PointerRegistry.ts src/vr/input/SystemGestureDetector.ts tests/xr-input-provider.test.ts
      - name: Commit verified repair and remove helper
        shell: bash
        run: |
          git rm .github/workflows/iwsdk-input-preflight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vr/InputRouter.ts
          git commit -m "test(input): pass IWSDK provider preflight [iwsdk-preflight]"
          git push origin HEAD:refactor/iwsdk-input-provider
