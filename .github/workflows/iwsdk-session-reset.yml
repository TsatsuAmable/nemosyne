name: IWSDK session reset boundary

on:
  push:
    branches:
      - refactor/iwsdk-input-provider

permissions:
  contents: write

jobs:
  reset-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/iwsdk-input-provider
      - name: Wire neutral reset on session loss
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/vr/InputRouter.ts')
          text = path.read_text()
          old = """    if (!session || !session.inputSources) {\n      this._lastSuppressSelection = false;\n      return;\n    }\n"""
          new = """    if (!session || !session.inputSources) {\n      this._lastSuppressSelection = false;\n      this.systemDetector.reset();\n      for (const controller of this.pointers.controllers) {\n        this.pointers.controllerTriggerPressed.set(controller, false);\n        this.pointers.controllerGripPressed.set(controller, false);\n      }\n      for (const hand of this.pointers.hands) {\n        this.pointers.lastHandPinched.set(hand, false);\n      }\n      return;\n    }\n"""
          if old not in text:
              raise SystemExit('expected no-session block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/iwsdk-session-reset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vr/InputRouter.ts
          git commit -m "fix(input): reset XR state at session boundary"
          git push origin HEAD:refactor/iwsdk-input-provider
