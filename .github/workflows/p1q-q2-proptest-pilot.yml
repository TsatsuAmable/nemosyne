name: P1-Q Q2 proptest pilot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p1q-q2-proptest-pilot.yml'
      - 'tools/property-testing/q2-proptest-pilot.rs'
      - 'docs/review-plans/P1Q_Q2_PROPTEST_PILOT_2026-08-28.md'
      - 'wasm/src/data/**'
      - 'wasm/Cargo.toml'
      - 'wasm/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proptest-pilot:
    name: Rust proptest pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Measure native Rust test baseline compile
        working-directory: wasm
        run: >-
          /usr/bin/time
          -f 'P1-Q Q2 Rust baseline compile elapsed=%e sec maxrss=%M KB'
          cargo test --lib sha256_matches_known_vector --no-run

      - name: Instrument transient proptest dependency and cases
        run: |
          cp tools/property-testing/q2-proptest-pilot.rs wasm/src/q2_proptest_pilot.rs
          printf '\n#[cfg(test)]\nmod q2_proptest_pilot;\n' >> wasm/src/lib.rs
          python - <<'PY'
          from pathlib import Path
          manifest = Path('wasm/Cargo.toml')
          text = manifest.read_text()
          marker = '[dev-dependencies]\n'
          dependency = 'proptest = { version = "=1.11.0", default-features = false, features = ["std"] }\n'
          if marker not in text:
              raise SystemExit('missing [dev-dependencies] marker')
          if 'proptest =' in text:
              raise SystemExit('proptest unexpectedly already present in Cargo.toml')
          manifest.write_text(text.replace(marker, marker + dependency, 1))
          PY
          cd wasm
          cargo generate-lockfile
          echo '=== P1-Q Q2 proptest dependency tree ==='
          cargo tree -p proptest --depth 2
          echo '=== P1-Q Q2 transient diff ==='
          git diff -- Cargo.toml Cargo.lock src/lib.rs

      - name: Run generated fingerprint properties and measure compile plus execution
        working-directory: wasm
        run: >-
          /usr/bin/time
          -f 'P1-Q Q2 proptest cold elapsed=%e sec maxrss=%M KB'
          env PROPTEST_CASES=256 PROPTEST_RNG_SEED=20260828
          cargo test --lib q2_proptest_ -- --nocapture

      - name: Measure warm generated-property runtime
        working-directory: wasm
        run: >-
          /usr/bin/time
          -f 'P1-Q Q2 proptest warm elapsed=%e sec maxrss=%M KB'
          env PROPTEST_CASES=256 PROPTEST_RNG_SEED=20260828
          cargo test --lib q2_proptest_ -- --nocapture

      - name: Prove shrinking and deterministic replay evidence
        working-directory: wasm
        run: |
          set +e
          PROPTEST_CASES=1 PROPTEST_RNG_SEED=20260828 PROPTEST_VERBOSE=1 \
            cargo test --lib q2_proptest_shrink_probe -- --ignored --nocapture \
            > q2-proptest-shrink.log 2>&1
          status=$?
          set -e
          cat q2-proptest-shrink.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the deliberate shrink probe to fail.' >&2
            exit 1
          fi
          grep -F 'minimal failing input: x = 10' q2-proptest-shrink.log
          echo 'Replay seed: PROPTEST_RNG_SEED=20260828'

      - name: Report transient workspace mutations
        run: git status --short
