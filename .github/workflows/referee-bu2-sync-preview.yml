name: Referee B-U2 sync and pure preview

on:
  push:
    branches:
      - fix/bu2-post-merge-truthfulness

permissions:
  contents: write

concurrency:
  group: referee-bu2-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/bu2-post-merge-truthfulness
          fetch-depth: 0

      - name: Sync current main
        run: |
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pure preview boundary
        run: python scripts/referee-bu2-pure-preview.py

      - name: Typecheck
        run: npm run typecheck

      - name: Focused regression tests
        run: >-
          npx vitest run
          tests/bu2-post-merge-truthfulness.test.ts
          tests/representation-preview-purity.test.ts
          tests/ui-system/vault-archive-lifecycle.test.ts
          tests/uv0-baseline-inventory.test.ts
          tests/rf062d-projection-bindings.test.ts

      - name: Fast regression suite
        run: npm run test:fast

      - name: Remove transient verification machinery
        run: rm scripts/referee-bu2-pure-preview.py .github/workflows/referee-bu2-sync-preview.yml

      - name: Commit verified current-main fix
        run: |
          git config user.name "Nemosyne Referee"
          git config user.email "referee@noreply.local"
          git add -A
          git commit -m "fix(b-u2): make remediation preview non-mutating"
          git push origin HEAD:fix/bu2-post-merge-truthfulness
