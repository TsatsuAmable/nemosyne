name: uxr0c1-implement-once

on:
  push:
    branches:
      - uxr/uxr0c1-ui-hot-path-allocation

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: uxr/uxr0c1-ui-hot-path-allocation
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Apply UXR0C1 patch
        run: python .github/uxr0c1_patch.py

      - name: Verify focused allocation and UI contracts
        run: |
          npm ci
          npm run test:fast -- tests/uxr0-hot-path-allocation.test.ts
          npm run test:integration -- tests/interaction-grammar-authority.test.ts
          npm run typecheck
          npm run lint
          git diff --check

      - name: Remove temporary tooling and push implementation
        run: |
          rm .github/uxr0c1_patch.py .github/workflows/uxr0c1-implement-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(uxr): remove UI hot-path vector allocations'
          git push origin HEAD:uxr/uxr0c1-ui-hot-path-allocation
