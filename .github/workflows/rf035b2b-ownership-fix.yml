name: RF035B2B ownership fix

on:
  push:
    branches: [fix/rf035b2b-reference-results]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/rf035b2b-reference-results
          fetch-depth: 0

      - name: Apply ownership and lineage corrections
        run: |
          python scripts/rf035b2b_ownership_fix.py
          python scripts/rf035b2b_metadata_refresh.py

      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/data/DatasetVersionStore.ts \
            src/atlas/domain/EvidenceLedger.ts \
            src/atlas/AtlasCore.ts \
            tests/rf035b2b-reference-result-storage.test.ts \
            scripts/rf035b2b_ownership_fix.py \
            scripts/rf035b2b_metadata_refresh.py \
            .github/workflows/rf035b2b-ownership-fix.yml
          git commit -m "fix(rf035): isolate compact historical row values"
          git push origin HEAD:fix/rf035b2b-reference-results
