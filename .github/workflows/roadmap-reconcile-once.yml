name: roadmap-reconcile-once

on:
  push:
    branches:
      - docs/roadmap-reconcile-2026-09-10

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/roadmap-reconcile-2026-09-10
          fetch-depth: 0

      - name: Reconcile canonical roadmap authority
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          roadmap_path = Path('docs/ROADMAP.md')
          text = roadmap_path.read_text()
          text = replace_once(text, '## Status snapshot - 2 September 2026', '## Status snapshot - 10 September 2026', 'snapshot date')
          old_snapshot = "**Current integration base for this planning update:** `main@70685c88e8d2d5bfb1fec70f5cc99bea4b15af0d` (#627, PT4A trust-boundary proposal landed). Stream A is fully closed. Stream B's first selected structural family, source-authoritative Relationship Graph V1, is `VERIFIED COMPLETE / STOP` through B1-B4. Stream C's bounded C1-C4 implementation/evidence wave has landed through #616; canonical desktop and simulator-testable journeys are now present, while physical XR fitness remains an explicit later evidence boundary rather than inferred completion. The rolling P1 product-transition programme is the forward execution frame: PT0 through PT3B are complete, RFC 0004 is accepted, and PT4B is authorized to implement the bounded authenticated consent-aware ingestion/storage/export/erasure vertical slice."
          new_snapshot = "**Current integration base for this planning update:** `main@24d38b7207b3cd933e05d18b36f4f4ebed3eb67d` (#699, consolidated Dependabot maintenance and coordinated Vitest 5 migration merged). Stream A remains closed. Stream B's first selected structural family, source-authoritative Relationship Graph V1, remains `VERIFIED COMPLETE / STOP`. Stream C's bounded C1-C4 software path remains landed, with physical XR fitness still an empirical qualification boundary. P1 product transition has advanced through PT8: PT4 and PT5 reached bounded STOP, PT6A-D (#661-#664) established governed gesture-learning evidence/snapshots, PT7 (#665) landed the runtime/model registry and reproducible learning jobs, and PT8 (#667) landed the governed gesture-model update loop. P1-UXR (#691) is now the active pre-PT9 product-development programme. PT9 Moneta learning evidence, PT10 private-preview learning, and post-PT9 compositional/full-Moneta work remain downstream."
          text = replace_once(text, old_snapshot, new_snapshot, 'integration snapshot')
          text = replace_once(text, '- QV0/QV1 validation manifest/launcher and the governed evidence sink are landed; #617 replaced error-prone governed manual Quest firmware/model attribution with fail-closed ADB machine capture. QV4 automatic gate adjudication remains open.', '- QV0/QV1 validation manifest/launcher and the governed evidence sink are landed; #617 replaced error-prone governed manual Quest firmware/model attribution with fail-closed ADB machine capture; QV4 automatic adjudication and evidence chain of custody landed in #668 and was fidelity-hardened in #669. Physical QV5/QV7 and other explicitly device/human-dependent claims remain open and may not be inferred from browser/simulator evidence.', 'QV status')
          old_order = '\n'.join(['```text', 'Stream A STOP', '  -> Stream B Relationship Graph V1 STOP', '    -> Stream C bounded C1-C4 implementation/evidence LANDED', '      -> P1-PT product transition (PT0-PT3B complete -> PT4 minimal vertical slice...)', '        -> assurance / selected-platform physical qualification / preview readiness', '          -> P1-W production wiring where still applicable', '            -> minimal private preview', '```'])
          new_order = '\n'.join(['```text', 'Stream A STOP', '  -> Stream B Relationship Graph V1 STOP', '    -> Stream C bounded C1-C4 implementation/evidence LANDED', '      -> P1-PT PT0-PT8 LANDED / bounded STOP where declared', '        -> P1-UXR ACTIVE (UXR0 -> UXR5)', '          -> PT9 Moneta learning-evidence pipeline', '            -> PT10 private-preview product/discovery learning loop', '              -> post-PT9 RepresentationOntology / RepresentationGraph / compositional full-Moneta work', '', 'Physical Quest/human evidence gates run when their claims require them; they do not block unrelated software work.', '```'])
          text = replace_once(text, old_order, new_order, 'sequential order')
          old_pt = '| **P1-PT - Product Transition & Evolutionary Improvement** | Turn the research system into a usable, maintainable, operable product while improving learning velocity without weakening scientific authority. | PT4B bounded authenticated consent-aware ingestion/storage/export/erasure implementation | **ACTIVE** | PT0-PT10 are completed or explicitly re-scoped with product, production, data, learning and private-preview evidence correctly classified. |'
          new_pt = old_pt.replace('PT4B bounded authenticated consent-aware ingestion/storage/export/erasure implementation', 'PT8 governed gesture-model update loop / #667').replace('**ACTIVE**', '**PT0-PT8 LANDED; PT9-PT10 DOWNSTREAM OF P1-UXR**') + '\n| **P1-UXR - Semantic-Efficiency UX, Runtime Simplification & Verification** | Make semantic spatial investigation cheaper, more natural and more stable while preserving analytical truth and provenance. | UXR0 baseline + replacement qualification contract | **ACTIVE / NEXT IMPLEMENTATION** | UXR0-UXR5 reach bounded STOP, with physical claims closed only by attributable device evidence; then PT9/PT10 resume. |'
          text = replace_once(text, old_pt, new_pt, 'programme table PT/UXR')
          text = replace_once(text, '| **D / assurance legacy boundary** | Preserve attributable validation, live-path security/privacy assurance and clean-production/device qualification contracts needed by the selected preview scope. | QV2 attribution landed; QV4/QV5/QV7 and security residuals open | **CONSUMED BY P1-PT / ACTIVE WHEN SELECTED** | Required assurance gates for the selected private-preview scope are satisfied; no browser/simulator evidence is promoted into physical proof. |', '| **D / assurance legacy boundary** | Preserve attributable validation, live-path security/privacy assurance and clean-production/device qualification contracts needed by the selected preview scope. | QV4 adjudication/custody landed (#668/#669); QV5/QV7 and selected physical/security residuals open | **CONSUMED BY P1-PT/P1-UXR / ACTIVE WHEN CLAIM-REQUIRED** | Required assurance gates for the selected private-preview scope are satisfied; no browser/simulator evidence is promoted into physical proof. |', 'assurance row')
          text = replace_once(text, "A is the shared semantic integration spine and is frozen at its finite P1-R5 boundary. B's first structural family is frozen at its Relationship Graph V1 boundary. C consumes A/B semantic state and may not manufacture analytical facts. P1-PT now sequences product, UX, CI, data, production and learning work. Quest remains a useful reference/qualification platform, not a strategic ceiling or master blocker for unrelated product development.", "A is the shared semantic integration spine and is frozen at its finite P1-R5 boundary. B's first structural family is frozen at its Relationship Graph V1 boundary. C consumes A/B semantic state and may not manufacture analytical facts. PT0-PT8 have landed; P1-UXR now owns the forward implementation stream before PT9/PT10. Quest remains a useful reference/qualification platform, not a strategic ceiling or master blocker for unrelated product development. Work that does not depend on fresh physical evidence may continue; claims about physical comfort, interaction fitness, sustained device performance or live-human outcomes may not.", 'authority summary')
          roadmap_path.write_text(text)

          uxr_path = Path('docs/roadmap/P1_UXR_SEMANTIC_EFFICIENCY_UX_RUNTIME_AND_VERIFICATION.md')
          uxr = uxr_path.read_text()
          uxr = replace_once(uxr, '**Status:** PRIORITY 1 / PLANNED  ', '**Status:** ACTIVE / UXR0 NEXT', 'UXR status')
          uxr = replace_once(uxr, 'P1-UXR supersedes PT6 as the **next product-development priority** once the currently active integration PR is resolved. PT6-PT10 remain relevant and resume after this bounded programme or when explicitly re-ordered by the product owner.', 'PT6 through PT8 have now landed. P1-UXR is the **active next product-development programme** before PT9, PT10 and the post-PT9 RepresentationOntology/RepresentationGraph/compositional full-Moneta path. Device/human evidence gates remain claim-specific rather than global blockers for unrelated implementation.', 'UXR priority paragraph')
          old_uxr_order = '\n'.join(['```text', 'current open integration work resolved', '  -> UXR0 baseline + replacement qualification contract', '    -> UXR1 interaction/UI substrate de-customisation', '      -> UXR2 render/resource efficiency + lifecycle governor', '        -> UXR3 bounded semantic working set + progressive materialisation', '          -> UXR4 verification-infrastructure refocus', '            -> UXR5 physical Quest qualification + STOP review', '              -> resume PT6+ / compositional Moneta prerequisites', '```'])
          new_uxr_order = '\n'.join(['```text', 'main after #699 dependency/Vitest maintenance', '  -> UXR0 baseline + replacement qualification contract', '    -> UXR1 interaction/UI substrate de-customisation', '      -> UXR2 render/resource efficiency + lifecycle governor', '        -> UXR3 bounded semantic working set + progressive materialisation', '          -> UXR4 verification-infrastructure refocus', '            -> UXR5 physical Quest qualification + STOP review', '              -> PT9 Moneta learning-evidence pipeline', '                -> PT10 private-preview learning loop', '                  -> post-PT9 compositional/full-Moneta prerequisites', '```'])
          uxr = replace_once(uxr, old_uxr_order, new_uxr_order, 'UXR order')
          uxr_path.write_text(uxr)
          PY

      - name: Remove helper and push reconciled docs
        run: |
          rm .github/workflows/roadmap-reconcile-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/roadmap/P1_UXR_SEMANTIC_EFFICIENCY_UX_RUNTIME_AND_VERIFICATION.md .github/workflows/roadmap-reconcile-once.yml
          git diff --cached --check
          git commit -m 'docs: reconcile roadmap after PT8 and P1-UXR'
          git push origin HEAD:docs/roadmap-reconcile-2026-09-10
