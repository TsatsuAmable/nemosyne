name: uxr0a-implement-once

on:
  push:
    branches:
      - uxr/uxr0a-baseline-observability

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: uxr/uxr0a-baseline-observability
          fetch-depth: 0

      - name: Apply bounded UXR0A patch
        run: python dev/uxr0a-once.py

      - name: Verify focused UXR0A falsifiers
        run: |
          npm ci
          npx vitest run tests/quest-telemetry.test.ts tests/loadtest-driver.test.ts
          npm run typecheck
          git diff --check

      - name: Remove temporary patch tooling and push implementation
        run: |
          rm .github/workflows/uxr0a-implement-once.yml dev/uxr0a-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vr/scalability/LoadTestThresholds.ts src/vr/scalability/LoadTestCollector.ts src/vr/scalability/LoadTestDriver.ts src/app/devEvidence.ts tests/quest-telemetry.test.ts tests/loadtest-driver.test.ts .github/workflows/uxr0a-implement-once.yml dev/uxr0a-once.py
          git diff --cached --check
          git commit -m 'feat(uxr): add UXR0 baseline observability contract'
          git push origin HEAD:uxr/uxr0a-baseline-observability
