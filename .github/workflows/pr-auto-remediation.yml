name: PR Auto Remediation

# Automatic PR remediation is intentionally disabled.
#
# The previous workflow reacted to submitted reviews and failed CI runs,
# invoked Copilot CLI, posted review/PR comments, and pushed verified fixes.
# Those automatic mutation paths are disabled until explicitly reintroduced.
# This manual, read-only stub preserves the operational history without
# allowing background comments, commits, or pushes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Auto remediation disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain status
        run: |
          echo 'PR auto-remediation is disabled.'
          echo 'No automatic review comments, commits, or pushes are performed.'
