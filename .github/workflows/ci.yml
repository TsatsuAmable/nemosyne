name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Documentation integrity
        run: npm run docs:check

  coverage-wasm:
    name: Coverage WASM package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache WASM build inputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: ${{ runner.os }}-wasm-dev-${{ hashFiles('wasm/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-wasm-dev-

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build development WASM package once
        run: npm run wasm:dev

      - name: Upload coverage WASM package
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-package
          path: wasm/pkg
          if-no-files-found: error
          retention-days: 7

  coverage-shard:
    name: Vitest coverage shard ${{ matrix.shard }}/3
    needs: coverage-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download coverage WASM package
        uses: actions/download-artifact@v8
        with:
          name: coverage-wasm-package
          path: wasm/pkg

      - name: Verify coverage WASM package
        run: test -s wasm/pkg/nemosyne_wasm_bg.wasm

      - name: Run coverage shard
        env:
          NEMOSYNE_COVERAGE_REPORT_ONLY: '1'
        run: >-
          npx vitest run
          --coverage
          --config vitest.coverage.config.ts
          --shard=${{ matrix.shard }}/3
          --reporter=blob
          --outputFile=vitest-shard-reports/blob-${{ matrix.shard }}.json

      - name: Upload shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage-shard-${{ matrix.shard }}
          path: vitest-shard-reports
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Vitest coverage
    if: ${{ always() }}
    needs: coverage-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce shard success
        env:
          SHARDS_RESULT: ${{ needs.coverage-shard.result }}
        run: test "$SHARDS_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-coverage-shard-*
          path: vitest-shard-reports
          merge-multiple: true

      - name: Merge coverage and enforce global thresholds
        run: >-
          npx vitest
          --merge-reports=vitest-shard-reports
          --config vitest.coverage.config.ts
          --reporter=default
          --coverage

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload tested production bundle
        uses: actions/upload-artifact@v7
        with:
          name: production-bundle
          path: dist
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('wasm/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run Rust unit tests
        run: cargo test --manifest-path wasm/Cargo.toml

  playwright-smoke:
    name: Chromium production smoke
    needs: production-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download tested production bundle
        uses: actions/download-artifact@v8
        with:
          name: production-bundle
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke
        env:
          NEMOSYNE_SMOKE_PREBUILT: '1'
        run: npm run test:smoke

      - name: Run collaboration recovery smoke
        run: npm run test:smoke:collaboration

  required:
    name: Node 24
    if: ${{ always() }}
    needs: [static, coverage, production-build, rust, playwright-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SMOKE_RESULT: ${{ needs.playwright-smoke.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SMOKE_RESULT" = success
