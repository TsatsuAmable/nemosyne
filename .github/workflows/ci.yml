name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    # Temporary Moneta migration fast lane: keep exactly one PR CI job so the
    # required check context remains `CI / Node 24` while preserving the core
    # correctness gate. Broader security, browser, build, benchmark and
    # coverage assurance remain available on main/scheduled/manual workflows.
    name: Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache wasm target
        uses: actions/cache@v4
        with:
          path: wasm/target
          key: ${{ runner.os }}-wasm-target-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-target-

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Rust unit tests
        run: cargo test --manifest-path wasm/Cargo.toml

      - name: Build WASM package (dev)
        run: npm run wasm:dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run full test suite
        run: npm test
