name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Documentation integrity
        run: npm run docs:check

      - name: GitHub Actions supply-chain pinning
        run: npm run ci:actions-check

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prove architecture boundary enforcement
        run: npm run architecture:boundaries:test

      - name: Enforce architecture boundaries
        run: npm run architecture:boundaries

      - name: Enforce architecture policy
        run: npm run architecture:check

  coverage-wasm:
    name: Coverage WASM package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore exact development WASM package
        id: wasm-pkg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: wasm/pkg
          key: ${{ runner.os }}-wasm-dev-pkg-v1-${{ hashFiles('wasm/Cargo.toml', 'wasm/Cargo.lock', 'wasm/src/**/*.rs', 'rust-toolchain.toml', 'scripts/build-wasm.mjs', 'package.json', 'package-lock.json') }}

      - name: Verify exact cached development WASM package
        if: steps.wasm-pkg-cache.outputs.cache-hit == 'true'
        run: test -s wasm/pkg/nemosyne_wasm_bg.wasm

      - name: Set up Rust toolchain
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache WASM build inputs
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: ${{ runner.os }}-wasm-dev-${{ hashFiles('wasm/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-wasm-dev-

      - name: Set up Node.js 24
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build development WASM package once
        if: steps.wasm-pkg-cache.outputs.cache-hit != 'true'
        run: npm run wasm:dev

      - name: Verify development WASM package
        run: test -s wasm/pkg/nemosyne_wasm_bg.wasm

      - name: Upload coverage WASM package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-wasm-package
          path: wasm/pkg
          if-no-files-found: error
          retention-days: 7

  coverage-shard:
    name: Vitest coverage shard ${{ matrix.shard }}/3
    needs: coverage-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download coverage WASM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-wasm-package
          path: wasm/pkg

      - name: Verify coverage WASM package
        run: test -s wasm/pkg/nemosyne_wasm_bg.wasm

      - name: Run coverage shard
        env:
          NEMOSYNE_COVERAGE_REPORT_ONLY: '1'
        run: >-
          npx vitest run
          --coverage
          --config vitest.coverage.config.ts
          --shard=${{ matrix.shard }}/3
          --reporter=blob
          --outputFile=vitest-shard-reports/blob-${{ matrix.shard }}.json

      - name: Upload shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-coverage-shard-${{ matrix.shard }}
          path: vitest-shard-reports
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Vitest coverage
    if: ${{ always() }}
    needs: coverage-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Enforce shard success
        env:
          SHARDS_RESULT: ${{ needs.coverage-shard.result }}
        run: test "$SHARDS_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vitest-coverage-shard-*
          path: vitest-shard-reports
          merge-multiple: true

      - name: Merge coverage and enforce global thresholds
        run: >-
          npx vitest
          --merge-reports=vitest-shard-reports
          --config vitest.coverage.config.ts
          --reporter=default
          --coverage

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Prove production bundle excludes UV0 instrumentation
        run: |
          if grep -R --binary-files=without-match -n -E '__NEMOSYNE_UV0__|nemosyne-uv0' dist; then
            echo 'ordinary production bundle contains P1-UV0 test instrumentation' >&2
            exit 1
          fi

      - name: Prove production bundle excludes RF-062H dev evidence
        run: |
          if grep -R --binary-files=without-match -n -E 'quest-3s-rust-boundary-10m|/__loadtest-results|\[QUEST 10M\]|\[LOAD TEST\]' dist; then
            echo 'ordinary production bundle contains RF-062H dev/research evidence tooling' >&2
            exit 1
          fi

      - name: Upload tested production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-bundle
          path: dist
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('wasm/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run Rust unit tests
        run: cargo test --manifest-path wasm/Cargo.toml

  playwright-smoke:
    name: Chromium production smoke
    needs: production-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download tested production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-bundle
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke
        env:
          NEMOSYNE_SMOKE_PREBUILT: '1'
        run: npm run test:smoke

      - name: Run collaboration recovery smoke
        run: npm run test:smoke:collaboration

  required:
    name: Node 24
    if: ${{ always() }}
    needs: [static, coverage, production-build, rust, playwright-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.production-build.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SMOKE_RESULT: ${{ needs.playwright-smoke.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SMOKE_RESULT" = success
