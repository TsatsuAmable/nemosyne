name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Core correctness
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache wasm target
        uses: actions/cache@v6
        with:
          path: wasm/target
          key: ${{ runner.os }}-wasm-target-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-target-

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WASM package for tests
        run: npm run wasm:dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Upload tested production bundle
        uses: actions/upload-artifact@v7
        with:
          name: production-bundle
          path: dist
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run Rust unit tests
        run: cargo test --manifest-path wasm/Cargo.toml

  playwright-smoke:
    name: Chromium production smoke
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download tested production bundle
        uses: actions/download-artifact@v8
        with:
          name: production-bundle
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke
        env:
          NEMOSYNE_SMOKE_PREBUILT: '1'
        run: npm run test:smoke

      - name: Run collaboration recovery smoke
        run: npm run test:smoke:collaboration

  required:
    name: Node 24
    if: ${{ always() }}
    needs: [correctness, rust, playwright-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          CORRECTNESS_RESULT: ${{ needs.correctness.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          SMOKE_RESULT: ${{ needs.playwright-smoke.result }}
        run: |
          test "$CORRECTNESS_RESULT" = success
          test "$RUST_RESULT" = success
          test "$SMOKE_RESULT" = success
