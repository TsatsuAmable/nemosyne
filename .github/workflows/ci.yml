name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Rapid PR iteration should not leave obsolete commits consuming runners. A new
# commit on the same PR/ref cancels the superseded CI run while unrelated PRs
# continue independently.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  rust:
    name: Rust unit tests (wasm/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache wasm target
        uses: actions/cache@v4
        with:
          path: wasm/target
          key: ${{ runner.os }}-wasm-target-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-target-

      - name: Run Rust unit tests
        run: cargo test --manifest-path wasm/Cargo.toml

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Single leg on Node 24 (active LTS, Oct 2025–). Node 20 reached EOL in
      # April 2026 and was dropped; Node 22 is maintenance LTS. The matrix is
      # retained (single-element) so a second leg can be re-added trivially if
      # a cross-version regression signal is ever needed. NOTE: the GitHub
      # branch-protection required-checks list must list "Node 24" (not 20/22).
      matrix:
        node-version: [24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Build the production WASM package once. Tests consume this same package,
      # and the later Vite build reuses it instead of invoking wasm-pack again.
      - name: Build WASM package
        run: npm run wasm

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # Lint is blocking: all src no-explicit-any errors are resolved; remaining
      # test any-usage is downgraded to non-blocking warnings (see eslint.config.js).
      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      # WASM was already built above. Build only the Vite application bundle.
      - name: Run production build
        run: npx vite build

      # Non-blocking visibility into bundle size; a hard gzipped budget is a follow-up.
      - name: Bundle size report (non-blocking)
        continue-on-error: true
        run: |
          du -sh dist
          node -e "const fs=require('fs'),zlib=require('zlib'),p=require('path');let t=0;const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const f=p.join(d,e.name);if(e.isDirectory())walk(f);else try{t+=zlib.gzipSync(fs.readFileSync(f)).length}catch{}}};walk('dist');console.log('gzipped total bytes:',t,'('+(t/1048576).toFixed(2)+' MiB)')"

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-node${{ matrix.node-version }}
          path: dist/
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore

  # Real-WebGL smoke validates the exact production artifact emitted by Node.
  # It remains a separate browser gate, but no longer rebuilds Rust/WASM/Vite.
  playwright-smoke:
    name: Playwright load smoke
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEMOSYNE_SMOKE_PREBUILT: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download production bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-node24
          path: dist/

      - name: Install Playwright browser (Chromium + system deps)
        run: npx playwright install --with-deps chromium

      - name: Run load smoke against prebuilt dist
        run: npm run test:smoke

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-trace
          path: test-results/
          if-no-files-found: ignore
