name: RF-062C temporary World wiring

on:
  push:
    branches:
      - refactor/rf-062c-dataset-representation-boundary

permissions:
  contents: write

jobs:
  wire-world:
    if: ${{ !contains(github.event.head_commit.message, '[rf062c-world-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refactor/rf-062c-dataset-representation-boundary
          fetch-depth: 0

      - name: Apply deterministic World wiring
        run: node scripts/rf062c-wire-world.mjs

      - name: Commit only the generated World change
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/vr/World.ts
          if git diff --quiet -- src/vr/World.ts; then
            echo 'World wiring already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vr/World.ts
          git commit -m 'refactor(rf-062c): wire World ownership boundaries [rf062c-world-applied]'
          git push origin HEAD:refactor/rf-062c-dataset-representation-boundary
