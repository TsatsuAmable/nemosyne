name: Reconcile XR simulator plan truth

on:
  push:
    branches:
      - docs/xr-simulator-stream-integration

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/xr-simulator-stream-integration
          fetch-depth: 0

      - name: Reconcile planning truth
        run: python .github/scripts/reconcile_xr_sim_plan_truth.py

      - name: Remove one-shot machinery
        run: rm .github/scripts/reconcile_xr_sim_plan_truth.py .github/workflows/reconcile-xr-sim-plan-truth.yml

      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md docs/review-plans/XR_SIMULATOR_STREAM_INTEGRATION_REVIEW_2026-08-28.md .github/scripts/reconcile_xr_sim_plan_truth.py .github/workflows/reconcile-xr-sim-plan-truth.yml
          git commit -m 'docs(xr): reconcile simulator plan with current main'
          git push origin HEAD:docs/xr-simulator-stream-integration
