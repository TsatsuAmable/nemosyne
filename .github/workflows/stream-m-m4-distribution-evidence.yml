name: Stream M M4 distribution browser evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/stream-m-m4-distribution-evidence.yml'
      - 'src/app/distributionEvidenceDiagnostics.ts'
      - 'src/app/resourceEnvelopeDiagnostics.ts'
      - 'src/app/dataset/LoadDatasetUseCase.ts'
      - 'src/app/AnalystJourneyControls.ts'
      - 'src/app/bootstrap.ts'
      - 'src/moneta/MonetaTopologyNode.ts'
      - 'src/moneta/embodiment/SemanticEmbodimentStatus.ts'
      - 'src/moneta/embodiment/ScalableTopologyEmbodiment.ts'
      - 'tests/smoke/stream-m-m4-distribution-evidence.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-m-m4-distribution-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Visible distribution + scale + perceptual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEMOSYNE_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEMOSYNE_M4_ROW_COUNTS: '1000,8000,32000'
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$NEMOSYNE_SOURCE_HEAD_SHA" ]]; then
            echo "Expected checkout $NEMOSYNE_SOURCE_HEAD_SHA but found $checkout_sha" >&2
            exit 1
          fi
          echo "NEMOSYNE_CHECKOUT_HEAD_SHA=$checkout_sha" >> "$GITHUB_ENV"
          echo "NEMOSYNE_WORKFLOW_EVENT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build instrumented production bundle
        run: |
          mkdir -p stream-m-m4-results
          /usr/bin/time -v -o stream-m-m4-results/build-time.txt \
            env \
              VITE_NEMOSYNE_DIAGNOSTICS=1 \
              VITE_NEMOSYNE_Q3B_RESOURCE_PROBE=1 \
              npm run build

      - name: Pin evidence artifact identities
        shell: bash
        run: |
          set -euo pipefail
          bundle_sha="$({ find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | awk '{print $1}')"
          wasm_sha="$(sha256sum dist/wasm/pkg/nemosyne_wasm_bg.wasm | awk '{print $1}')"
          echo "NEMOSYNE_M4_BUNDLE_SHA256=$bundle_sha" >> "$GITHUB_ENV"
          echo "NEMOSYNE_M4_WASM_SHA256=$wasm_sha" >> "$GITHUB_ENV"
          printf 'source_head_sha=%s\ncheckout_head_sha=%s\nworkflow_event_sha=%s\nbundle_sha256=%s\nwasm_sha256=%s\n' \
            "$NEMOSYNE_SOURCE_HEAD_SHA" \
            "$NEMOSYNE_CHECKOUT_HEAD_SHA" \
            "$NEMOSYNE_WORKFLOW_EVENT_SHA" \
            "$bundle_sha" \
            "$wasm_sha" \
            | tee stream-m-m4-results/artifact-identities.txt

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture M4 production evidence
        run: |
          /usr/bin/time -v -o stream-m-m4-results/probe-time.txt \
            env \
              NEMOSYNE_M4_BROWSER_PROBE=1 \
              NEMOSYNE_SMOKE_PREBUILT=1 \
              npx playwright test tests/smoke/stream-m-m4-distribution-evidence.spec.ts --retries=0

      - name: Upload M4 structured and visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stream-m-m4-distribution-evidence
          path: stream-m-m4-results
          if-no-files-found: warn
          retention-days: 7
