name: rf035b2-compile-fix
on:
  push:
    branches: [fix/rf035b2-row-view-transfer]
    paths:
      - 'scripts/fix-rf035b2-compile.py'
      - '.github/workflows/rf035b2-compile-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/rf035b2-row-view-transfer
          fetch-depth: 0
      - run: python scripts/fix-rf035b2-compile.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wasm/src/lib.rs src/wasm/runtime/DatasetHandleBridge.ts
          git add -u -- .github/workflows/rf035b2-compile-fix.yml scripts/fix-rf035b2-compile.py
          git commit -m 'fix(rf035): harden compact row-view ABI validation'
          git push origin HEAD:fix/rf035b2-row-view-transfer
