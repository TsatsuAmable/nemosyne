name: P1-Q Q2 fast-check pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1q-q2-fast-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check-pilot:
    name: fast-check bounded properties
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install exact pilot dependency in isolated prefix
        run: |
          NODE_MODULES_LOCK_BEFORE="$(sha256sum node_modules/.package-lock.json | cut -d' ' -f1)"
          npm install \
            --prefix "$RUNNER_TEMP/p1q-q2-fast-check" \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            fast-check@4.9.0 \
            pure-rand@8.4.2
          test "$(node -p "require('$RUNNER_TEMP/p1q-q2-fast-check/node_modules/fast-check/package.json').version")" = '4.9.0'
          test "$(node -p "require('$RUNNER_TEMP/p1q-q2-fast-check/node_modules/pure-rand/package.json').version")" = '8.4.2'
          NODE_MODULES_LOCK_AFTER="$(sha256sum node_modules/.package-lock.json | cut -d' ' -f1)"
          test "$NODE_MODULES_LOCK_BEFORE" = "$NODE_MODULES_LOCK_AFTER"
          git diff --exit-code -- package.json package-lock.json
          echo "fast-check=4.9.0 pure-rand=8.4.2 isolated-prefix=$RUNNER_TEMP/p1q-q2-fast-check"

      - name: Run bounded property pilot
        env:
          P1Q_FAST_CHECK_ROOT: ${{ runner.temp }}/p1q-q2-fast-check
        run: >-
          /usr/bin/time
          -f 'P1-Q Q2 elapsed=%e sec maxrss=%M KB'
          node tools/property-testing/q2-fast-check-pilot.mjs
