name: Data Boundary Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/benchmark-data-boundary.mjs'
      - 'wasm/src/data/**'
      - 'wasm/src/lib.rs'
      - '.github/workflows/data-boundary-benchmark.yml'
  workflow_dispatch:
    inputs:
      tier:
        description: Deterministic dataset tier (10m remains local/provisioned-only)
        required: true
        default: 100k
        type: choice
        options:
          - 10k
          - 100k
          - 1m

permissions:
  contents: read

concurrency:
  group: data-boundary-benchmark-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tier || 'scale-gate' }}
  cancel-in-progress: true

jobs:
  pr-scale-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WASM package
        run: npm run wasm:dev

      - name: Run 100K and 1M canonical-columnar scale gate
        run: |
          node --expose-gc scripts/benchmark-data-boundary.mjs --tier=100k --tier=1m --json > data-boundary-scale-gate.json
          cat data-boundary-scale-gate.json

      - name: Publish summary
        run: |
          echo "## Rust/WASM canonical-columnar scale gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Tiers: \`100k + 1m\` in one WASM runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data-boundary-scale-gate.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: data-boundary-scale-gate
          path: data-boundary-scale-gate.json
          if-no-files-found: error
          retention-days: 30

  dispatched-tier:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WASM package
        run: npm run wasm:dev

      - name: Run boundary benchmark
        run: |
          node --expose-gc scripts/benchmark-data-boundary.mjs --tier="${{ inputs.tier }}" --json > data-boundary-benchmark-${{ inputs.tier }}.json
          cat data-boundary-benchmark-${{ inputs.tier }}.json

      - name: Publish summary
        run: |
          echo "## Rust/WASM data boundary benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "Tier: \`${{ inputs.tier }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data-boundary-benchmark-${{ inputs.tier }}.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: data-boundary-benchmark-${{ inputs.tier }}
          path: data-boundary-benchmark-${{ inputs.tier }}.json
          if-no-files-found: error
          retention-days: 30
