name: Architecture policy pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dependency-cruiser.cjs'
      - 'sgconfig.yml'
      - 'tools/architecture-policy/**'
      - 'tools/rf061-provenance-rewrite.py'
      - '.github/workflows/architecture-policy-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rf061-provenance:
    name: Pair RF061 TDA values with provenance
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/rf-061-derived-recompute-coalescing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Apply provenance pairing rewrite
        run: python tools/rf061-provenance-rewrite.py
      - name: Restore architecture workflow and publish rewrite
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/architecture-policy-pilot.yml
          git rm -f tools/rf061-provenance-rewrite.py
          git config user.name "nemosyne-rf061-bot"
          git config user.email "noreply@github.com"
          git add -- src/vr/artifacts/TDAPlanes.ts src/vr/coordinators/DerivedAnalysisPipeline.ts tests/derived-analysis-pipeline.test.ts .github/workflows/architecture-policy-pilot.yml
          git diff --cached --check
          git commit -m "fix(rf-061): preserve TDA provenance across async reuse"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  architecture-policy:
    name: P1-Q Q0 architecture policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run architecture policy with timing
        run: /usr/bin/time -f 'P1-Q Q0 elapsed=%e sec maxrss=%M KB' npm run architecture:check
