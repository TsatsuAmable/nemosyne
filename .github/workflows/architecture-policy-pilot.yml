name: Architecture policy audit

# The architecture policy is enforced in required CI / Static analysis.
# This workflow remains available only for explicit timing/RSS measurement.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-policy-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-policy:
    name: Architecture policy timing audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run architecture policy with timing
        run: /usr/bin/time -f 'architecture-policy elapsed=%e sec maxrss=%M KB' npm run architecture:check
