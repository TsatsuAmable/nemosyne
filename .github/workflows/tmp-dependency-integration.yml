name: Temporary dependency integration

on:
  push:
    branches:
      - maintenance/dependabot-vitest5-integration

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: maintenance/dependabot-vitest5-integration

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Set coordinated direct dependency ranges
        run: |
          npm pkg set "devDependencies.@ast-grep/cli=0.45.3"
          npm pkg set "devDependencies.vitest=^5.0.0"
          npm pkg set "devDependencies.@vitest/coverage-v8=^5.0.0"

      - name: Regenerate coordinated lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm update --package-lock-only --ignore-scripts @typescript-eslint/eslint-plugin @typescript-eslint/parser globals @pmndrs/uikit @scure/base

      - name: Apply deploy-pages patch
        run: |
          sed -i 's#actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128#actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346#' .github/workflows/pages.yml

      - name: Verify clean install resolution
        run: npm ci --ignore-scripts

      - name: Commit generated dependency state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/pages.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No dependency changes generated.'
            exit 1
          fi
          git commit -m 'build: integrate dependency updates and Vitest 5'
          git push origin HEAD:maintenance/dependabot-vitest5-integration
