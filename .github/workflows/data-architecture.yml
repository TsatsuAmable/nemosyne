name: Data Architecture Gate

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Dataset tier for manual diagnostic runs
        required: true
        default: scale-gate
        type: choice
        options:
          - scale-gate
          - 10k
          - 100k
          - 1m

permissions:
  contents: read

# Temporarily manual-only during the Moneta migration-completion sprint. This
# keeps benchmark evidence available without adding a routine PR gate.
concurrency:
  group: data-architecture-${{ github.ref }}-${{ inputs.tier || 'scale-gate' }}
  cancel-in-progress: true

jobs:
  data-architecture:
    name: Data architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WASM package once
        run: npm run wasm:dev

      - name: Select benchmark tiers
        id: tiers
        shell: bash
        run: |
          if [ "${{ inputs.tier }}" != "scale-gate" ]; then
            echo "args=--tier=${{ inputs.tier }}" >> "$GITHUB_OUTPUT"
            echo "label=${{ inputs.tier }}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--tier=100k --tier=1m" >> "$GITHUB_OUTPUT"
            echo "label=100k + 1m" >> "$GITHUB_OUTPUT"
          fi

      - name: Typed-column ingest gate
        id: typed
        continue-on-error: true
        run: |
          node --expose-gc scripts/benchmark-typed-column-ingest.mjs ${{ steps.tiers.outputs.args }} --json > typed-column-ingest.json
          cat typed-column-ingest.json

      - name: Canonical boundary gate
        id: boundary
        if: always()
        continue-on-error: true
        run: |
          node --expose-gc scripts/benchmark-data-boundary.mjs ${{ steps.tiers.outputs.args }} --json > data-boundary-scale-gate.json
          cat data-boundary-scale-gate.json

      - name: Data-load profile
        id: profile
        if: always()
        continue-on-error: true
        run: |
          node --expose-gc scripts/profile-data-load.mjs ${{ steps.tiers.outputs.args }} --json > data-load-profile.json
          cat data-load-profile.json

      - name: Publish consolidated summary and validate evidence
        if: always()
        id: evidence
        shell: bash
        run: |
          echo '## Data architecture gate' >> "$GITHUB_STEP_SUMMARY"
          echo "Tiers: ${{ steps.tiers.outputs.label }}" >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for f in typed-column-ingest.json data-boundary-scale-gate.json data-load-profile.json; do
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            if [ -s "$f" ]; then
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Missing or empty result.' >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo '::error::One or more data-architecture evidence files are missing or empty.'
            exit 1
          fi

      - name: Upload data-architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-architecture-gate
          path: |
            typed-column-ingest.json
            data-boundary-scale-gate.json
            data-load-profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce benchmark results
        if: always()
        shell: bash
        run: |
          failed=0
          if [ "${{ steps.typed.outcome }}" != "success" ]; then
            echo '::error::Typed-column ingest gate failed.'
            failed=1
          fi
          if [ "${{ steps.boundary.outcome }}" != "success" ]; then
            echo '::error::Canonical boundary gate failed.'
            failed=1
          fi
          if [ "${{ steps.profile.outcome }}" != "success" ]; then
            echo '::error::Data-load profile failed.'
            failed=1
          fi
          exit "$failed"
