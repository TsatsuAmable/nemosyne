name: approval-gate

# Enforces the repository merge policy documented in docs/ROADMAP.md.
#
# This required promotion gate owns only the evidence unique to promotion and
# governance: live-ruleset drift, owner approval authority, exact-head identity,
# review disposition and the adversarial/promotion marker. The live repository
# ruleset independently requires Node 24 and CodeQL, so this gate must not poll
# or duplicate those checks.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  approval-gate:
    name: approval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify governance policy matches live ruleset
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-governance-policy.mjs

      - id: gate
        name: Verify approval authority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          AUTHOR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login')
          echo "PR #$PR_NUMBER author=$AUTHOR owner=$OWNER head=$HEAD_SHA"

          APPROVED=false
          if [ "$AUTHOR" = "$OWNER" ]; then
            APPROVED=true
            echo "Author is the repo owner - auto-approved."
          elif gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate \
              --jq ".[] | select(.user.login==\"$OWNER\" and .state==\"APPROVED\" and .commit_id==\"$HEAD_SHA\")" \
              | grep -q .; then
            APPROVED=true
            echo "Approved by owner $OWNER on $HEAD_SHA."
          fi

          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
          if [ "$APPROVED" != "true" ]; then
            echo "::error::Blocked until the repository owner approves this PR."
            exit 1
          fi

      - name: Verify exact-head promotion evidence
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-promotion-evidence.mjs
          --pr "$PR_NUMBER"
          --sha "$HEAD_SHA"
