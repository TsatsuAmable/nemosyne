name: approval-gate

# Enforces the repository merge policy documented in docs/ROADMAP.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write
  pull-requests: write

jobs:
  approval-gate:
    name: approval-gate
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER='${{ github.repository_owner }}'
          PR_NUMBER='${{ github.event.pull_request.number }}'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'

          AUTHOR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login')
          echo "PR #$PR_NUMBER author=$AUTHOR owner=$OWNER head=$HEAD_SHA"

          APPROVED=false
          if [ "$AUTHOR" = "$OWNER" ]; then
            APPROVED=true
            echo "Author is the repo owner - auto-approved."
          elif gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate \
              --jq ".[] | select(.user.login==\"$OWNER\" and .state==\"APPROVED\" and .commit_id==\"$HEAD_SHA\")" \
              | grep -q .; then
            APPROVED=true
            echo "Approved by owner $OWNER on $HEAD_SHA."
          fi

          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
          if [ "$APPROVED" != "true" ]; then
            echo "::error::Blocked until the repository owner approves this PR."
            exit 1
          fi

      - name: Enable auto-merge when approved
        if: steps.gate.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER='${{ github.event.pull_request.number }}'
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash \
            || echo "Auto-merge not enabled (fork, draft, or already merged)."
