name: approval-gate

# Enforces the repository merge policy documented in docs/ROADMAP.md.
#
# This is the required final promotion gate. It first establishes the owner
# approval authority, then waits boundedly for the other required exact-head
# checks and runs the shared Q9 promotion-evidence controller while the PR is
# still open. Auto-merge therefore cannot outrun exact-head promotion evidence.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  approval-gate:
    name: approval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: gate
        name: Verify approval authority
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER='${{ github.repository_owner }}'
          PR_NUMBER='${{ github.event.pull_request.number }}'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'

          AUTHOR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.user.login')
          echo "PR #$PR_NUMBER author=$AUTHOR owner=$OWNER head=$HEAD_SHA"

          APPROVED=false
          if [ "$AUTHOR" = "$OWNER" ]; then
            APPROVED=true
            echo "Author is the repo owner - auto-approved."
          elif gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate \
              --jq ".[] | select(.user.login==\"$OWNER\" and .state==\"APPROVED\" and .commit_id==\"$HEAD_SHA\")" \
              | grep -q .; then
            APPROVED=true
            echo "Approved by owner $OWNER on $HEAD_SHA."
          fi

          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
          if [ "$APPROVED" != "true" ]; then
            echo "::error::Blocked until the repository owner approves this PR."
            exit 1
          fi

      - name: Verify exact-head promotion evidence
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-promotion-evidence.mjs
          --pr ${{ github.event.pull_request.number }}
          --sha ${{ github.event.pull_request.head.sha }}
          --required-checks "Node 24,CodeQL SAST (javascript-typescript)"
          --wait-seconds 720
          --poll-seconds 10
