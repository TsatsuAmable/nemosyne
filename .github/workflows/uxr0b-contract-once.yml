name: uxr0b-contract-once

on:
  push:
    branches:
      - uxr/uxr0b-worker-transfer-ab-contract

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: uxr/uxr0b-worker-transfer-ab-contract
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Apply shared UXR0 contract patch
        run: python .github/uxr0b_contract_patch.py

      - name: Verify consolidated UXR0 contracts
        run: |
          npm ci
          npm run wasm:dev
          npm run test:fast -- tests/uxr0-worker-transfer-diagnostics.test.ts tests/uxr0-replacement-qualification.test.ts
          npm run test:integration -- tests/loadtest-driver.test.ts tests/atlas-async-execution.test.ts
          npm run typecheck
          npm run lint
          git diff --check origin/main...HEAD

      - name: Remove temporary consolidation tooling and push
        run: |
          rm .github/uxr0b_contract_patch.py .github/workflows/uxr0b-contract-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(uxr): centralize UXR0 qualification profile authority'
          git push origin HEAD:uxr/uxr0b-worker-transfer-ab-contract
