name: Bootstrap integrity hash dependencies

on:
  push:
    branches: [security/hash-integrity-hardening]

permissions:
  contents: write

jobs:
  update-locks-and-codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hash-integrity-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Apply exact hash migration codemod
        run: node scripts/apply-hash-integrity-codemod.mjs
      - name: Resolve RustCrypto SHA-256 lock metadata
        run: cargo check --manifest-path wasm/Cargo.toml
      - name: Commit generated migration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/network/NetworkManager.ts src/study/ExperimentRunner.ts src/moneta/ConstraintArbiter.ts src/atlas/AtlasCore.ts src/moneta/representation/MonetaHypothesisEngine.ts wasm/src/lib.rs wasm/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "refactor(security): migrate remaining hash consumers"
          git push origin HEAD:security/hash-integrity-hardening
