name: Bootstrap integrity hash dependencies

on:
  push:
    branches: [security/hash-integrity-hardening]

permissions:
  contents: write

jobs:
  update-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hash-integrity-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add audited browser-safe SHA-256 dependency
        run: npm install --save-exact @noble/hashes@2.3.0
      - name: Add RustCrypto SHA-256 dependency
        run: cargo add sha2@0.10 --manifest-path wasm/Cargo.toml
      - name: Commit dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json wasm/Cargo.toml wasm/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "build(security): add audited hash dependencies"
          git push origin HEAD:security/hash-integrity-hardening
