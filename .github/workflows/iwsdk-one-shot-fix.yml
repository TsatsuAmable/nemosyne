name: IWSDK one-shot typing repair

on:
  push:
    branches:
      - refactor/iwsdk-input-provider

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/iwsdk-input-provider
      - name: Apply narrow repair
        shell: bash
        run: |
          sed -i 's/removeHudObject(obj: THREE.Object3D)/removeHudObject(obj: HudObject)/' src/vr/InputRouter.ts
          git rm .github/workflows/iwsdk-one-shot-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vr/InputRouter.ts
          git commit -m "fix(input): restore HUD object contract"
          git push origin HEAD:refactor/iwsdk-input-provider
