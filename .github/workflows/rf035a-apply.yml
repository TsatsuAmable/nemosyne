name: RF035A resident-registration patch

on:
  push:
    branches:
      - fix/rf035-worker-resident-registration
    paths:
      - .github/workflows/rf035a-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/rf035-worker-resident-registration
      - name: Apply bounded RF-035A patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch target, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/atlas/ports/AnalyticalExecutionPort.ts',
              """  registerDataset?(registration: AnalyticalDatasetRegistration): Promise<void>;
  /** Release worker/listener resources owned by this port. */
""",
              """  registerDataset?(registration: AnalyticalDatasetRegistration): Promise<void>;
  /**
   * True only when this exact canonical fingerprint is already resident in the
   * supplied runtime generation. This is a transport-local capability query,
   * not an analytical authority claim. Ports that cannot attest residency omit
   * it, forcing Atlas to retain/materialize ordinary registration data.
   */
  hasRegisteredDataset?(generation: number, fingerprint: string): boolean;
  /** Release worker/listener resources owned by this port. */
""",
          )

          replace_once(
              'src/atlas/ports/WorkerAnalyticalPort.ts',
              """  registerDataset(registration: AnalyticalDatasetRegistration): Promise<void> {
""",
              """  hasRegisteredDataset(generation: number, fingerprint: string): boolean {
    if (this._disposed || !fingerprint) return false;
    return this._registered.has(this._registrationKey(generation, fingerprint));
  }

  registerDataset(registration: AnalyticalDatasetRegistration): Promise<void> {
""",
          )

          replace_once(
              'src/atlas/AtlasCore.ts',
              """    if (!port.registerDataset) {
      throw new KernelUnavailableError(
        '[AtlasCore] asynchronous analytical port cannot register worker-local datasets.'
      );
    }
    const payload = this._workerRegistrationPayload();
    if (!payload) {
      throw new KernelUnavailableError(
        `[AtlasCore] no worker registration payload is available for dataset ${fingerprint}.`
      );
    }
    const generation = this._generation;
    await port.registerDataset({
""",
              """    if (!port.registerDataset) {
      throw new KernelUnavailableError(
        '[AtlasCore] asynchronous analytical port cannot register worker-local datasets.'
      );
    }
    const generation = this._generation;
    // RF-035A: ask the transport whether this exact authoritative dataset is
    // already resident before constructing registration material. Dataset.toJSON()
    // is O(rows × columns), so building a payload merely to have registerDataset()
    // discard it defeats the resident-handle fast path.
    if (port.hasRegisteredDataset?.(generation, fingerprint)) {
      return (
        generation === this._generation &&
        version === this.datasetVersion &&
        fingerprint === (this.datasetFingerprint ?? '')
      );
    }
    const payload = this._workerRegistrationPayload();
    if (!payload) {
      throw new KernelUnavailableError(
        `[AtlasCore] no worker registration payload is available for dataset ${fingerprint}.`
      );
    }
    await port.registerDataset({
""",
          )

          replace_once(
              'src/atlas/AtlasCore.ts',
              """    this._setWorkerPayloadFromDataset(this._aggregate.analytical.currentNullable);
    port.supersede({
      generation: this._generation,
      datasetVersion: this.datasetVersion,
      datasetFingerprint: result.outputFingerprint,
    });
""",
              """    port.supersede({
      generation: this._generation,
      datasetVersion: this.datasetVersion,
      datasetFingerprint: result.outputFingerprint,
    });
    // The Worker adopts a mutation's Rust output handle before RESULT resolves.
    // If the active port can prove that fingerprint remains resident after the
    // version transition, do not create a redundant O(N) DatasetJSON snapshot.
    // Keep the main-thread Dataset itself so recovery can materialize lazily.
    if (port.hasRegisteredDataset?.(this._generation, result.outputFingerprint)) {
      this._workerDatasetPayload = null;
    } else {
      this._setWorkerPayloadFromDataset(this._aggregate.analytical.currentNullable);
    }
""",
          )

          replace_once(
              'docs/ROADMAP.md',
              """Merged-state Stream-B review found that #478's new >=50k-row worker registration path emitted a bespoke non-NTC1 binary payload and selected only numeric columns before handing those bytes to the canonical Rust typed loader. This fix-forward tranche restores the governed NTC1 codec for the lossless numeric subset and keeps mixed/graph datasets on canonical JSON.""",
              """Merged-state Stream-B review found that #478's new >=50k-row worker registration path emitted a bespoke non-NTC1 binary payload and selected only numeric columns before handing those bytes to the canonical Rust typed loader. #479 removed automatic row-backed -> typed conversion from shared Worker registration: row-backed datasets remain operation-complete canonical JSON, while explicit typed inputs retain the governed NTC1 path. RF-035 owns the next operation-aware resident/transfer optimization.""",
          )
          PY

          rm .github/workflows/rf035a-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/atlas/ports/AnalyticalExecutionPort.ts src/atlas/ports/WorkerAnalyticalPort.ts src/atlas/AtlasCore.ts docs/ROADMAP.md .github/workflows/rf035a-apply.yml
          git commit -m 'fix(rf035): skip resident worker registration snapshots'
          git push origin HEAD:fix/rf035-worker-resident-registration
