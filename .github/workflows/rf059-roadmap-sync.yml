name: RF-059 roadmap sync helper

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  sync-roadmap:
    if: >-
      github.event.pull_request.number == 505 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/rf-059-row-identity-remap'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/rf-059-row-identity-remap
          fetch-depth: 0

      - name: Insert RF-059 ledger row exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ROADMAP.md')
          text = path.read_text(encoding='utf-8')
          if '| RF-059 |' in text:
              raise SystemExit(0)

          lines = text.splitlines(keepends=True)
          matches = [index for index, line in enumerate(lines) if line.startswith('| RF-058 |')]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one RF-058 ledger row, found {len(matches)}')

          row = (
              '| RF-059 | P1-A/P1-B / Rust row identity & scale | High | '
              'Q3C same-operation measurement exposed worst-case `O(n² × columns)` source-row identity recovery in '
              '`Dataset::clone_with_rows`: every row-preserving output rediscovered its source through a linear equality scan, '
              'dominating Rust `sort` at 32k rows. | '
              '**IMPLEMENTATION LANDED / REVIEW ACTIVE via #505:** index declared scientific row values once and consume FIFO source indices '
              'so duplicate, missing/null, signed-zero, NaN, durable-row-ID and graph-remap semantics remain equivalent. '
              'Same-harness Q3C remeasurement reduced the 32k Rust sort kernel from ~36.4 s to ~0.43 s (~83–84x; ~98.8% reduction) '
              'with identical authoritative scientific fingerprints. Preserve the regressions and keep RF-029/RF-035/RF-051 open for the remaining full pipeline/device envelope. |\n'
          )
          lines.insert(matches[0] + 1, row)
          path.write_text(''.join(lines), encoding='utf-8')
          PY

          git diff --check
          git diff -- docs/ROADMAP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/ROADMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs(roadmap): record RF-059 row identity scale fix'
          git push origin HEAD:fix/rf-059-row-identity-remap
