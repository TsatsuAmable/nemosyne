# THROWAWAY: regenerate package-lock.json on Linux so it includes the linux
# platform variants of optional native binaries (lightningcss, @rolldown/binding)
# that npm 11 (Node 24) requires but a Windows-generated lockfile omits.
# Triggered manually via workflow_dispatch; downloads the artifact locally,
# commits the lockfile, then this file is deleted. Not a permanent workflow.
name: Regen lockfile (Linux)

on:
  workflow_dispatch:

jobs:
  regen:
    name: Regenerate package-lock.json on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Regenerate lockfile (package-lock-only, linux resolve)
        run: npm install --package-lock-only

      - name: Report platform variants present
        run: |
          node -e "const l=require('./package-lock.json');const k=Object.keys(l.packages||{});console.log('lightningcss:');k.filter(x=>x.includes('lightningcss')).forEach(x=>console.log(' ',x));console.log('rolldown/binding:');k.filter(x=>x.includes('rolldown/binding')).forEach(x=>console.log(' ',x))"

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-lock
          path: package-lock.json
          if-no-files-found: error