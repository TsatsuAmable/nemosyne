name: Data Load Profile

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/profile-data-load.mjs'
      - 'wasm/src/data/**'
      - 'wasm/src/lib.rs'
      - '.github/workflows/data-load-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-load-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WASM package
        run: npm run wasm:dev

      - name: Profile 100K and 1M load path
        run: |
          node --expose-gc scripts/profile-data-load.mjs --tier=100k --tier=1m --json > data-load-profile.json
          cat data-load-profile.json

      - name: Publish summary
        run: |
          echo '## Rust/WASM data-load decomposition' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data-load-profile.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile
        uses: actions/upload-artifact@v4
        with:
          name: data-load-profile
          path: data-load-profile.json
          if-no-files-found: error
          retention-days: 30
