name: Referee B-U2 bounded fix

on:
  push:
    branches:
      - fix/bu2-post-merge-truthfulness

permissions:
  contents: write

concurrency:
  group: referee-bu2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/bu2-post-merge-truthfulness
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply referee patch
        run: |
          python scripts/referee-bu2-fix.py
          python scripts/referee-bu2-corrections.py

      - name: Typecheck
        run: npm run typecheck

      - name: Focused regression tests
        run: >-
          npx vitest run
          tests/bu2-post-merge-truthfulness.test.ts
          tests/ui-system/vault-archive-lifecycle.test.ts
          tests/uv0-baseline-inventory.test.ts

      - name: Remove transient patch machinery
        run: rm scripts/referee-bu2-fix.py scripts/referee-bu2-corrections.py .github/workflows/referee-bu2-apply.yml

      - name: Commit verified fix
        run: |
          git config user.name "Nemosyne Referee"
          git config user.email "referee@noreply.local"
          git add -A
          git commit -m "fix(b-u2): close post-merge truthfulness blockers"
          git push origin HEAD:fix/bu2-post-merge-truthfulness
