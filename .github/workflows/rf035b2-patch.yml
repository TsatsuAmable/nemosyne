name: rf035b2-patch
on:
  push:
    branches: [fix/rf035b2-row-view-transfer]
    paths:
      - 'scripts/apply-rf035b2-row-view.py'
      - '.github/workflows/rf035b2-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/rf035b2-row-view-transfer
          fetch-depth: 0
      - name: Apply RF-035B2 patch
        run: python scripts/apply-rf035b2-row-view.py
      - name: Commit production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/wasm/runtime/RuntimeExports.ts wasm/src/lib.rs src/wasm/runtime/DatasetHandleBridge.ts src/wasm/RuntimeBridge.ts src/atlas/ports/AnalyticalExecutionPort.ts src/atlas/ports/analytical.worker.ts src/atlas/domain/AnalyticalState.ts src/atlas/AtlasCore.ts tests/rf035b2-row-view-transfer.test.ts
          git add -u -- .github/workflows/rf035b2-patch.yml scripts/apply-rf035b2-row-view.py
          git commit -m 'feat(rf035): compact row-preserving Worker results'
          git push origin HEAD:fix/rf035b2-row-view-transfer
