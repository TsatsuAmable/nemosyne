name: P1-Q Q2 fast-check adoption lockfile

on:
  push:
    branches: [test/p1q-q2-fast-check-adoption]
    paths:
      - '.github/workflows/p1q-q2-fast-check-adoption-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: generate exact fast-check lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout adoption branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: test/p1q-q2-fast-check-adoption

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Generate exact lockfile candidate without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact fast-check@4.9.0

      - name: Verify Q8 metadata and generated dependency graph
        run: |
          npm view fast-check@4.9.0 version license dependencies scripts dist.integrity --json
          npm view pure-rand@8.4.2 version license dependencies scripts dist.integrity --json
          npm audit --audit-level=moderate

      - name: Measure locked install candidate
        run: >-
          /usr/bin/time
          -f 'P1-Q Q2 locked npm-ci elapsed=%e sec maxrss=%M KB'
          npm ci --ignore-scripts

      - name: Commit only generated package manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Lockfile already matches fast-check@4.9.0 adoption candidate.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m 'build(p1q): lock fast-check adoption dependency'
          git push origin HEAD:test/p1q-q2-fast-check-adoption
