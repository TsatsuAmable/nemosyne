name: Rust JS Boundary Envelope

on:
  schedule:
    - cron: '37 4 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capacity:
    name: 10M boundary characterization
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run wasm:dev
      - name: Characterize the 10K through 10M Rust JS boundary
        run: |
          node --expose-gc scripts/benchmark-columnar-capacity.mjs --json > rust-js-boundary.json
          node --expose-gc scripts/benchmark-columnar-capacity.mjs --scenario=tall10m --repeat=3 --json > rust-js-boundary-repeat-10m.json
          cat rust-js-boundary.json
          cat rust-js-boundary-repeat-10m.json
      - name: Publish summary
        if: always()
        run: |
          echo '## Rust JS boundary envelope' >> "$GITHUB_STEP_SUMMARY"
          if [ -f rust-js-boundary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat rust-js-boundary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Boundary benchmark did not produce an artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f rust-js-boundary-repeat-10m.json ]; then
            echo '### Repeated 10M envelope' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat rust-js-boundary-repeat-10m.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Repeated 10M benchmark did not produce an artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rust-js-boundary-envelope
          path: |
            rust-js-boundary.json
            rust-js-boundary-repeat-10m.json
          if-no-files-found: warn
          retention-days: 30
