name: reconcile-rf035b-roadmap

on:
  push:
    branches:
      - docs/roadmap-reconcile-rf035b

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/roadmap-reconcile-rf035b
      - name: Reconcile roadmap
        run: python .github/scripts/reconcile_rf035b_roadmap.py
      - name: Commit reconciliation
        shell: bash
        run: |
          rm .github/workflows/reconcile-rf035b-roadmap.yml
          rm .github/scripts/reconcile_rf035b_roadmap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/ROADMAP.md .github/workflows/reconcile-rf035b-roadmap.yml .github/scripts/reconcile_rf035b_roadmap.py
          git diff --cached --check
          git commit -m 'docs(roadmap): reconcile RF-035 residency state'
          git push origin HEAD:docs/roadmap-reconcile-rf035b
