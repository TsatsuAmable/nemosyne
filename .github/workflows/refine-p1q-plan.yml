name: Refine P1-Q plan

on:
  push:
    branches:
      - docs/p1q-engineering-quality-cadence
    paths:
      - scripts/refine-p1q-plan.py
      - .github/workflows/refine-p1q-plan.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/p1q-engineering-quality-cadence
          fetch-depth: 0
      - name: Refine plan
        run: python scripts/refine-p1q-plan.py
      - name: Remove one-shot helpers
        run: |
          rm scripts/refine-p1q-plan.py
          rm .github/workflows/refine-p1q-plan.yml
      - name: Commit refined plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/ROADMAP.md docs/review-plans/P1Q_ENGINEERING_QUALITY_CADENCE_2026-08-28.md scripts/refine-p1q-plan.py .github/workflows/refine-p1q-plan.yml
          git commit -m 'docs(p1q): refine observability and network evidence boundaries'
          git push
