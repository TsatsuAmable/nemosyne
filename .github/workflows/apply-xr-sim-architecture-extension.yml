name: Apply XR simulator architecture extension
on:
  push:
    branches: [docs/xr-simulator-architecture-extension]
    paths:
      - .github/scripts/apply_xr_sim_architecture_extension.py
      - .github/workflows/apply-xr-sim-architecture-extension.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: docs/xr-simulator-architecture-extension
          fetch-depth: 0
      - name: Apply architecture extension
        run: python .github/scripts/apply_xr_sim_architecture_extension.py
      - name: Remove one-shot patch machinery
        run: rm .github/scripts/apply_xr_sim_architecture_extension.py .github/workflows/apply-xr-sim-architecture-extension.yml
      - name: Commit roadmap extension
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md .github/scripts/apply_xr_sim_architecture_extension.py .github/workflows/apply-xr-sim-architecture-extension.yml
          git commit -m 'docs(xr): extend simulator plan across architecture'
          git push origin HEAD:docs/xr-simulator-architecture-extension
