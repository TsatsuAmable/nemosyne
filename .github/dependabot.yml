version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    ignore:
      # jsdom 30.1.0 regression: URL.createObjectURL TypeError (_buffer) breaks tests/download-utils.test.ts
      dependency-name: "jsdom"
      versions: [">=30.1.0"]
    groups:
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: cargo
    directory: /wasm
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/London
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
